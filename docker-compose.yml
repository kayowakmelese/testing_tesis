version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: gaming_postgres
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=gaming#5515
      - POSTGRES_DB=gaming
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gaming_network

  redis:
    image: redis:7-alpine
    container_name: gaming_redis
    ports:
      - "6380:6379"
    networks:
      - gaming_network
    command: redis-server --requirepass gaming#5515

volumes:
  postgres_data:

networks:
  gaming_network:
    driver: bridge
